<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Minimalist Male Poodle / Caniche Macho Minimalista -->
  <defs>
    <filter id="poodleShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#poodleShadow)">
    <!-- Fluffy Poodle Ears (Minimalist Curved Shapes) -->
    <!-- Left Ear -->
    <path d="M 18 21 C 10 24, 7 34, 9 43 C 11 48.5, 17 48, 19.5 43 C 21.5 37, 20.5 27, 18 21 Z" 
          fill="#EDF2F7" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>
    
    <!-- Right Ear -->
    <path d="M 46 21 C 54 24, 57 34, 55 43 C 53 48.5, 47 48, 44.5 43 C 42.5 37, 43.5 27, 46 21 Z" 
          fill="#EDF2F7" stroke="#1E293B" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- Head Base -->
    <ellipse cx="32" cy="35" rx="16" ry="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2"/>

    <!-- Minimalist Poodle Topknot (Copete geométrico y limpio) -->
    <circle cx="23" cy="18" r="6.8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2"/>
    <circle cx="41" cy="18" r="6.8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2"/>
    <circle cx="32" cy="13.5" r="7.8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.2"/>
    <!-- Center white fill to seamlessly blend the topknot with the head -->
    <ellipse cx="32" cy="20" rx="12" ry="8.5" fill="#FFFFFF"/>

    <!-- Eyes (Minimalist, dark, focused) -->
    <circle cx="24.5" cy="31.5" r="3.2" fill="#1E293B"/>
    <circle cx="23.6" cy="30.4" r="1.1" fill="#FFFFFF"/>

    <circle cx="39.5" cy="31.5" r="3.2" fill="#1E293B"/>
    <circle cx="38.6" cy="30.4" r="1.1" fill="#FFFFFF"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="32" cy="40" rx="8" ry="5.5" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.8"/>

    <!-- Nose -->
    <path d="M 29 38 C 29 37, 35 37, 35 38 C 35 40, 33 41.5, 32 41.5 C 31 41.5, 29 40, 29 38 Z" fill="#1E293B"/>
    <circle cx="30.5" cy="38" r="0.6" fill="#FFFFFF"/>

    <!-- Mouth -->
    <path d="M 32 41.5 L 32 43.5" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M 28.5 43 C 30 44.5, 32 44.2, 32 43.5 C 32 44.2, 34 44.5, 35.5 43" 
          fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Elegant Minimalist Blue Bow Tie / Corbatín Azul -->
    <g id="bowtie">
      <!-- Left bow wing -->
      <polygon points="32,49 26,45.5 26,52.5" fill="#0284C7" stroke="#0369A1" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Right bow wing -->
      <polygon points="32,49 38,45.5 38,52.5" fill="#0284C7" stroke="#0369A1" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Center knot -->
      <circle cx="32" cy="49" r="1.9" fill="#38BDF8" stroke="#0369A1" stroke-width="1"/>
    </g>
  </g>
</svg>
