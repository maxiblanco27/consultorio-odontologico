<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nonadoc</title>
    <link rel="stylesheet" href="stylepage.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div class="container">
    <header>
        <h1>🦷 Registro de Pacientes</h1>
    </header>

    <div id="updateBanner" style="display: none; background-color: #fff3cd; color: #856404; padding: 15px; align-items: center; justify-content: space-between; font-weight: bold; margin-bottom: 20px; border-radius: 6px; border: 1px solid #ffeeba;">
        <span>🚀 ¡Hay una nueva versión del sistema disponible!</span>
        <button onclick="window.location.reload(true)" style="padding: 8px 15px; background-color: #856404; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Recargar página</button>
    </div>
    
    <!-- Contenedor para mostrar mensajes de error o estado al usuario -->
    <div id="alertMessage" style="display: none; padding: 12px 15px; margin-bottom: 20px; border-radius: 6px; font-weight: bold; font-size: 14px;"></div>
    
    <section class="card">
        <h2 class="section-title">Datos del Paciente</h2>
        <form id="patientForm">
            <div class="grid-layout">
                <div class="field">
                    <label>Nombre y Apellido</label>
                    <input type="text" id="fullName" required placeholder="Ej: Ana García">
                </div>
                <div class="field">
                    <label>DNI / Cédula</label>
                    <input type="text" id="dni" required placeholder="Número de documento">
                </div>
                <div class="field">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="field">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com">
                </div>
                <div class="field">
                    <label>Teléfono</label>
                    <input type="tel" id="phone" placeholder="WhatsApp o celular">
                </div>
                
                <div class="field">
                    <label>Barrio</label>
                    <input type="text" id="neighborhood" placeholder="Ej: Centro">
                </div>
                <div class="field">
                    <label>Obra Social</label>
                    <input type="text" id="healthInsurance" placeholder="Nombre de la cobertura">
                </div>
               
                <div class="field full-width">
                    <label>Detalles del Tratamiento</label>
                    <textarea id="treatment" rows="5" placeholder="Escriba aquí los detalles..."></textarea>
                </div>
            </div>
            <button type="submit" class="btn-guardar" id="saveBtn">Guardar en el Historial</button>
        </form>
    </section>

    <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 15px;">
            <h2 class="section-title">Historial de Consultas</h2>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre o DNI...">
            </div>
        </div>

        <div class="table-container">
            <table id="patientsTable">
               <thead>
                    <tr>
                        <th>Paciente</th>
                        <th>DNI</th>
                        <th>Nacimiento</th>
                        <th>Email</th> <!-- NUEVA COLUMNA -->
                        <th>Teléfono</th>
                        <th>Barrio</th>
                        <th>Obra Social</th>
                        <th>Tratamiento</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="patientsList"></tbody>
            </table>
        </div>
    </section>
</div>

<!-- Librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Tu archivo JavaScript -->
<script src="script.js"></script>

</body>
</html>
